# Slim CI (decision 4 of the reproducibility pass, 2026-07-04): everything that
# runs WITHOUT the 19 GB container — GitHub-hosted runners have ~14 GB of free
# disk, so the full `make build` deliberately stays a local/manual step
# (documented in docs/guides/DE-NOVO.md). This proves the host-side half of a
# clean clone: stdlib-only Python suites, the docs link/citation gate, the
# smoke-script syntax, and the VSCode extension build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-side:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python unit suites (stdlib only — no pip install)
        run: |
          set -e
          for t in host/scripts/tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

      - name: docs-check (dead links / dead '# Spec:' citations)
        run: python3 host/scripts/docs_check.py

      - name: smoke script syntax
        run: bash -n tests/smoke/smoke.sh

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: install (reproducible, from lockfile)
        run: npm ci
      - name: compile
        run: npm run compile
